name: Zelda Crossover - Wind Waker UWP
on:
  push:
    branches: [codex/tp-ww-crossover-uwp]
    paths: ['crossover/**', '.github/workflows/build-crossover-uwp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crossover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up build tools and short paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          git config --global core.autocrlf false
          subst S: "$env:GITHUB_WORKSPACE"
          "CROSSOVER_ROOT=S:\" >> $env:GITHUB_ENV
          choco install ninja -y --no-progress
          python -m pip install PyYAML Pillow pefile
          if ($LASTEXITCODE) { throw 'Python dependencies failed' }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang-cl.exe")) { throw 'clang-cl is unavailable' }
          $llvm >> $env:GITHUB_PATH
      - name: Prepare pinned sources
        shell: pwsh
        run: |
          python S:\crossover\tools\prepare.py --out S:\build\sources
          if ($LASTEXITCODE) { throw 'Source preparation failed' }
          python S:\crossover\tools\package_assets.py
          if ($LASTEXITCODE) { throw 'Package artwork generation failed' }
      - name: Build Windows Store SDL
        shell: pwsh
        run: |
          cmake -S S:/build/sources/sdl -B S:/build/sdl -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore '-DCMAKE_SYSTEM_VERSION=10.0' `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF
          if ($LASTEXITCODE) { throw 'SDL configuration failed' }
          cmake --build S:\build\sdl --config Release --target SDL3-shared --parallel 4
          if ($LASTEXITCODE) { throw 'SDL compilation failed' }
          python S:\crossover\tools\stage_runtime.py --sources S:\build\sources --sdl-build S:\build\sdl --out S:\build\runtime
          if ($LASTEXITCODE) { throw 'SDL runtime validation failed' }
      - name: Check UWP launcher compilation
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /DWINAPI_FAMILY=WINAPI_FAMILY_APP /D_WIN32_WINNT=0x0A00 `
            /I S:\build\runtime\x64\include /Zs S:\crossover\platforms\uwp\main.cpp
          if ($LASTEXITCODE) { throw 'UWP launcher compilation failed' }
      - name: Configure Wind Waker UWP core
        shell: pwsh
        run: |
          cmake -S S:/build/sources/windwaker/native -B S:/build/feed -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_OBJECT_PATH_MAX=180 `
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON -DCOS_UWP=ON -DCOS_RUNTIME_ASSETS=ON `
            -DCOS_ASSETS_DIR=S:/build/sources/assets/GZLE01 -DCOS_RECOMPCORE_DIR=S:/build/sources/recompcore `
            -DFETCHCONTENT_SOURCE_DIR_AURORA=S:/build/sources/aurora -DCOS_AURORA_PREPATCHED=ON `
            -DAURORA_UWP_DEP_SOURCE_DIR=S:/build/runtime -DAURORA_ENABLE_TESTS=OFF `
            -DAURORA_BUILD_TESTS=OFF -DAURORA_ENABLE_EXAMPLES=OFF -DTRACY_ENABLE=OFF
          if ($LASTEXITCODE) { throw 'Wind Waker UWP configuration failed' }
      - name: Compile Wind Waker and Aurora
        shell: pwsh
        run: |
          cmake --build S:\build\feed --target cos_uwp_game --parallel 4 -- -k 0 2>&1 |
            Tee-Object -FilePath S:\build\compile.log
          if ($LASTEXITCODE) { throw 'Wind Waker UWP compilation failed' }
      - name: Configure UWP app
        shell: pwsh
        run: |
          cmake -S S:/crossover/platforms/uwp -B S:/build/package -G 'Visual Studio 17 2022' -A x64 `
            -DWW_FEED=S:/build/feed -DUWP_DEPS=S:/build/runtime -DPACKAGE_VERSION=0.1.0.1
          if ($LASTEXITCODE) { throw 'UWP app configuration failed' }
      - name: Compile and package UWP app
        shell: pwsh
        run: |
          cmake --build S:\build\package --config RelWithDebInfo --parallel 2 -- `
            /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE) { throw 'UWP link or packaging failed' }
      - name: Verify, sign and collect
        shell: pwsh
        run: |
          python S:\crossover\tools\verify_package.py --build S:\build\package --out S:\build\deliverables --runtime S:\build\runtime\x64\bin
          if ($LASTEXITCODE) { throw 'Package compatibility checks failed' }
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=ZeldaCrossoverUWP' `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          Export-Certificate -Cert $cert -FilePath S:\build\deliverables\ZeldaCrossoverUWP.cer | Out-Null
          signtool sign /fd SHA256 /sha1 $cert.Thumbprint S:\build\deliverables\ZeldaCrossover_0.1.0.1_x64.msix
          if ($LASTEXITCODE) { throw 'Package signing failed' }
          Copy-Item S:\build\sources\source-provenance.json S:\build\deliverables\
          Copy-Item S:\crossover\INSTALL_XBOX.txt S:\build\deliverables\
          python S:\crossover\tools\source_bundle.py --sources S:\build\sources --feed S:\build\feed --out S:\build\deliverables
          if ($LASTEXITCODE) { throw 'Source and notice collection failed' }
          Get-ChildItem S:\build\deliverables -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content S:\build\deliverables\SHA256SUMS.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-Crossover-UWP-0.1.0.1
          path: build/deliverables/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Crossover-build-diagnostics
          path: |
            build/compile.log
            build/package/**/ZeldaCrossoverUWP.pdb
            build/deliverables/package-validation.json
            build/feed/CMakeCache.txt
            build/feed/CMakeFiles/CMakeConfigureLog.yaml
            build/sources/source-provenance.json
          if-no-files-found: ignore
